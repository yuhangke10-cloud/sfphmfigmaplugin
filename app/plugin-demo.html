<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRRC Sifang PHM 3.0 Design System Manager - HTML Demo</title>
    <style>
      :root {
        color-scheme: dark;
        --sds-bg: #121212;
        --sds-panel: #1e1e1e;
        --sds-panel-2: #252525;
        --sds-panel-3: #303030;
        --sds-border: #3a3a3a;
        --sds-border-strong: #5f5f5f;
        --sds-text: #f5f5f5;
        --sds-muted: #b3b3b3;
        --sds-subtle: #858585;
        --sds-accent: #7ca7ff;
        --sds-accent-strong: #0c5fff;
        --sds-danger: #ff8f87;
        --sds-radius: 8px;
        --sds-font: Inter, "Segoe UI", "Source Han Sans SC", "Microsoft YaHei", Arial, sans-serif;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        min-height: 100vh;
        overflow: hidden;
        color: var(--sds-text);
        background: var(--sds-bg);
        font-family: var(--sds-font);
        font-size: 12px;
      }
      html {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      button, input, select, textarea { font: inherit; }
      button { cursor: pointer; }
      .app {
        display: grid;
        grid-template-columns: 228px minmax(0, 1fr);
        height: 100vh;
        overflow: hidden;
      }
      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 16px 12px;
        background: #181818;
        border-right: 1px solid var(--sds-border);
        overflow: hidden;
      }
      .brand {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 4px 6px 8px;
      }
      .brand-mark {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.16);
        border-radius: 7px;
        background: #ffffff;
      }
      .brand-mark img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .brand strong { display: block; font-size: 13px; }
      .brand span { display: block; margin-top: 2px; color: var(--sds-subtle); }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .nav-button {
        display: grid;
        grid-template-columns: 24px 1fr;
        gap: 8px;
        align-items: center;
        width: 100%;
        min-height: 34px;
        padding: 6px 8px;
        border: 1px solid transparent;
        border-radius: 6px;
        color: var(--sds-muted);
        background: transparent;
        text-align: left;
      }
      .nav-button:hover {
        color: var(--sds-text);
        background: var(--sds-panel-2);
        border-color: var(--sds-border);
      }
      .nav-button.is-active {
        color: #ffffff;
        background: var(--sds-accent-strong);
        border-color: #4d83ff;
      }
      .nav-index {
        color: inherit;
        opacity: 0.72;
        font-variant-numeric: tabular-nums;
      }
      .sidebar-footer {
        margin-top: auto;
        display: grid;
        gap: 8px;
        padding: 10px;
        border: 1px solid var(--sds-border);
        border-radius: var(--sds-radius);
        color: var(--sds-muted);
        background: var(--sds-panel);
        line-height: 1.45;
      }
      .main {
        display: flex;
        min-width: 0;
        flex-direction: column;
        overflow: hidden;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        min-height: 64px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--sds-border);
        background: #161616;
      }
      .title h1 {
        margin: 0;
        font-size: 17px;
        line-height: 1.25;
      }
      .title p {
        margin: 4px 0 0;
        color: var(--sds-muted);
        line-height: 1.4;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }
      .content {
        min-height: 0;
        overflow-x: hidden;
        overflow-y: auto;
        padding: 18px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: 12px;
      }
      .panel {
        grid-column: span 12;
        padding: 14px;
        border: 1px solid var(--sds-border);
        border-radius: var(--sds-radius);
        background: var(--sds-panel);
      }
      .panel.half { grid-column: span 6; }
      .panel.third { grid-column: span 4; }
      .panel h2, .panel h3 {
        margin: 0 0 8px;
        font-size: 13px;
      }
      .panel p {
        margin: 0;
        color: var(--sds-muted);
        line-height: 1.55;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }
      .stat {
        padding: 12px;
        border: 1px solid var(--sds-border);
        border-radius: var(--sds-radius);
        background: var(--sds-panel-2);
      }
      .stat strong { display: block; font-size: 20px; }
      .stat span { color: var(--sds-muted); }
      .field-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }
      .seed-card {
        padding: 12px;
        border: 1px solid var(--sds-border);
        border-radius: var(--sds-radius);
        background: var(--sds-panel-2);
      }
      .seed-card label {
        display: block;
        margin-bottom: 8px;
        color: var(--sds-muted);
      }
      .seed-preview {
        height: 54px;
        margin-bottom: 10px;
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 6px;
      }
      .input-row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .text-input, .select-input, .json-output {
        width: 100%;
        min-height: 32px;
        padding: 7px 9px;
        border: 1px solid var(--sds-border-strong);
        border-radius: 6px;
        color: var(--sds-text);
        background: #111111;
        outline: none;
      }
      .text-input:focus, .select-input:focus, .json-output:focus {
        border-color: var(--sds-accent);
        box-shadow: 0 0 0 1px var(--sds-accent);
      }
      .control-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: end;
      }
      .control {
        display: grid;
        min-width: 180px;
        gap: 6px;
      }
      .control label {
        color: var(--sds-muted);
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 32px;
        padding: 0 12px;
        border: 1px solid var(--sds-border-strong);
        border-radius: 6px;
        color: var(--sds-text);
        background: var(--sds-panel-2);
        line-height: 1;
        text-align: center;
        white-space: nowrap;
      }
      .button:hover { background: var(--sds-panel-3); }
      .button.primary {
        color: #ffffff;
        border-color: #4d83ff;
        background: var(--sds-accent-strong);
      }
      .button.danger {
        color: var(--sds-danger);
      }
      .palette-stack {
        display: grid;
        gap: 12px;
      }
      .palette-row {
        display: grid;
        grid-template-columns: 150px minmax(0, 1fr);
        gap: 12px;
        align-items: stretch;
      }
      .palette-name {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 10px;
        border: 1px solid var(--sds-border);
        border-radius: var(--sds-radius);
        background: var(--sds-panel-2);
      }
      .palette-name strong { font-size: 12px; }
      .palette-name span { margin-top: 4px; color: var(--sds-subtle); }
      .swatches {
        display: grid;
        grid-template-columns: repeat(13, minmax(0, 1fr));
        min-height: 66px;
        overflow: hidden;
        border: 1px solid var(--sds-border);
        border-radius: var(--sds-radius);
      }
      .swatch {
        position: relative;
        padding: 6px;
        min-width: 0;
        color: var(--label-color, #ffffff);
        font-size: 10px;
        line-height: 1.25;
      }
      .swatch span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .mini-swatch {
        display: inline-block;
        width: 14px;
        height: 14px;
        margin-right: 6px;
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 3px;
        vertical-align: -2px;
      }
      .style-token-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
        margin-top: 14px;
      }
      .style-token-card {
        display: grid;
        grid-template-rows: 64px auto auto;
        gap: 10px;
        min-width: 0;
        padding: 12px;
        border: 1px solid var(--sds-border);
        border-radius: 6px;
        background: var(--sds-panel-2);
      }
      .style-token-card header { min-width: 0; }
      .style-token-card header strong,
      .style-token-card header span { display: block; overflow-wrap: anywhere; }
      .style-token-card header span { margin-top: 3px; color: var(--sds-muted); font-size: 11px; }
      .style-token-controls { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
      .style-token-controls .control { min-width: 0; }
      .style-token-controls input { min-width: 0; }
      .style-token-preview {
        position: relative;
        display: grid;
        place-items: center;
        min-height: 64px;
        overflow: hidden;
        border: 1px solid var(--sds-border);
        border-radius: 4px;
        background: repeating-conic-gradient(#2b2b2b 0 25%, #222 0 50%) 50% / 12px 12px;
      }
      .style-preview-shape { width: 70%; height: 32px; border-radius: 4px; background: #d9d9d9; }
      .token-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(174px, 1fr));
        gap: 10px;
      }
      .token-card {
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr);
        gap: 10px;
        align-items: center;
        min-height: 64px;
        padding: 9px;
        border: 1px solid var(--sds-border);
        border-radius: var(--sds-radius);
        background: var(--sds-panel-2);
      }
      .token-color {
        width: 42px;
        height: 42px;
        border-radius: 6px;
        border: 1px solid rgba(255,255,255,0.16);
      }
      .token-copy { min-width: 0; }
      .token-copy strong {
        display: block;
        overflow: hidden;
        color: var(--sds-text);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .token-copy span {
        display: block;
        margin-top: 3px;
        overflow: hidden;
        color: var(--sds-muted);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .section-stack {
        display: grid;
        gap: 14px;
      }
      .mode-chip {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        margin: 0 6px 6px 0;
        padding: 0 8px;
        border: 1px solid var(--sds-border);
        border-radius: 999px;
        color: var(--sds-muted);
        background: var(--sds-panel-2);
      }
      .preview-shell {
        overflow: hidden;
        border: 1px solid var(--sds-border);
        border-radius: var(--sds-radius);
        background: var(--preview-content-bg);
      }
      .preview-tabs {
        display: flex;
        gap: 8px;
        align-items: center;
        min-height: 42px;
        padding: 8px;
        border-bottom: 1px solid var(--preview-border);
        color: var(--preview-shell-text);
        background: var(--preview-shell-bg);
      }
      .preview-logo {
        display: grid;
        width: 28px;
        height: 28px;
        place-items: center;
        border-radius: 5px;
        color: var(--preview-logo-color);
        font-weight: 800;
      }
      .preview-tab {
        padding: 6px 10px;
        border-radius: 5px;
        background: rgba(255,255,255,0.06);
      }
      .preview-tab.active {
        color: var(--preview-tab-active-text);
        background: var(--preview-tab-active-bg);
      }
      .preview-body {
        display: grid;
        grid-template-columns: 130px minmax(0, 1fr);
        min-height: 230px;
      }
      .preview-sider {
        padding: 10px;
        color: var(--preview-shell-text);
        background: var(--preview-sider-bg);
      }
      .preview-menu {
        padding: 8px 10px;
        border-radius: 5px;
        margin-bottom: 6px;
      }
      .preview-menu.active {
        color: var(--preview-menu-active-text);
        background: var(--preview-menu-active-bg);
      }
      .preview-content {
        display: grid;
        gap: 10px;
        padding: 12px;
        background: var(--preview-content-bg);
      }
      .preview-breadcrumb { color: var(--preview-breadcrumb-text); }
      .preview-nav {
        display: flex;
        gap: 12px;
        color: var(--preview-muted-text);
      }
      .preview-nav span.active {
        color: var(--preview-text);
        box-shadow: inset 0 -2px var(--preview-nav-indicator);
      }
      .preview-cards {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .preview-mode-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .preview-mode-grid > div > h3 {
        margin: 0 0 8px;
        font-size: 12px;
        color: var(--sds-muted);
      }
      .preview-card {
        min-height: 116px;
        padding: 12px;
        border: 1px solid var(--preview-border);
        border-radius: 8px;
        color: var(--preview-text);
        background: var(--preview-card-bg);
      }
      .preview-card p {
        color: var(--preview-muted-text);
      }
      .bars {
        display: flex;
        gap: 6px;
        align-items: end;
        height: 46px;
        margin-top: 12px;
      }
      .bars span {
        width: 18px;
        border-radius: 4px 4px 0 0;
        background: var(--bar);
      }
      .json-output {
        min-height: 220px;
        resize: vertical;
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 11px;
        line-height: 1.5;
      }
      .notice {
        padding: 10px;
        border: 1px solid var(--sds-border);
        border-radius: var(--sds-radius);
        color: var(--sds-muted);
        background: var(--sds-panel-2);
      }
      .notice.success { border-color: #338c5b; color: #9ce3bd; }
      .notice.error { border-color: #9f423b; color: #ffaaa3; }
      .image-tools {
        display: grid;
        grid-template-columns: minmax(220px, 320px) minmax(0, 1fr);
        gap: 12px;
      }
      .image-preview {
        display: grid;
        min-height: 172px;
        place-items: center;
        overflow: hidden;
        border: 1px dashed var(--sds-border-strong);
        border-radius: var(--sds-radius);
        color: var(--sds-muted);
        background: #111111;
      }
      .image-preview img {
        display: block;
        max-width: 100%;
        max-height: 220px;
        object-fit: contain;
      }
      .swatch-actions {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(156px, 1fr));
        gap: 10px;
      }
      .image-swatch {
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr);
        gap: 10px;
        align-items: center;
        padding: 9px;
        border: 1px solid var(--sds-border);
        border-radius: var(--sds-radius);
        background: var(--sds-panel-2);
      }
      .image-swatch-color {
        width: 42px;
        height: 42px;
        border-radius: 6px;
        border: 1px solid rgba(255,255,255,0.16);
      }
      .image-swatch-meta { min-width: 0; }
      .image-swatch-meta strong,
      .image-swatch-meta span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .image-swatch-meta span {
        margin-top: 3px;
        color: var(--sds-muted);
      }
      .role-buttons {
        display: flex;
        gap: 4px;
        margin-top: 7px;
      }
      .role-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 24px;
        padding: 0 7px;
        border: 1px solid var(--sds-border-strong);
        border-radius: 5px;
        color: var(--sds-text);
        background: #151515;
        line-height: 1;
        text-align: center;
      }
      .file-button input { display: none; }
      .summary-list {
        display: grid;
        gap: 8px;
        margin-top: 12px;
      }
      .summary-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 10px;
        border: 1px solid var(--sds-border);
        border-radius: 6px;
        background: var(--sds-panel-2);
      }
      .summary-row span:first-child { color: var(--sds-muted); }
      .summary-row small {
        flex-basis: 100%;
        color: var(--sds-muted);
        line-height: 1.5;
      }
      .step-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 12px;
      }
      .step-tab {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 30px;
        padding: 0 10px;
        border: 1px solid var(--sds-border);
        border-radius: 6px;
        color: var(--sds-muted);
        background: var(--sds-panel-2);
        line-height: 1;
        text-align: center;
        white-space: nowrap;
      }
      .step-tab:hover {
        color: var(--sds-text);
        background: var(--sds-panel-3);
      }
      .step-tab.is-active {
        color: #ffffff;
        border-color: #4d83ff;
        background: var(--sds-accent-strong);
      }
      .system-card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 10px;
        margin-top: 12px;
      }
      .system-card {
        min-height: 104px;
        padding: 12px;
        border: 1px solid var(--sds-border);
        border-radius: var(--sds-radius);
        background: var(--sds-panel-2);
      }
      .system-card strong {
        display: block;
        margin-bottom: 8px;
      }
      .system-card span {
        display: block;
        color: var(--sds-muted);
        line-height: 1.5;
      }
      .grid-device-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 12px;
        margin-top: 12px;
      }
      .grid-device-card {
        display: grid;
        gap: 12px;
        padding: 12px;
        border: 1px solid var(--sds-border);
        border-radius: var(--sds-radius);
        background: var(--sds-panel-2);
      }
      .grid-device-head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: start;
      }
      .grid-device-head strong {
        display: block;
        font-size: 13px;
      }
      .grid-device-head span,
      .grid-metric span {
        color: var(--sds-muted);
      }
      .grid-device-tag {
        padding: 3px 7px;
        border: 1px solid var(--sds-border);
        border-radius: 999px;
        color: var(--sds-muted);
        white-space: nowrap;
      }
      .grid-controls {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }
      .grid-controls label {
        display: grid;
        gap: 5px;
        color: var(--sds-muted);
      }
      .grid-controls input {
        width: 100%;
        min-height: 30px;
        padding: 6px 8px;
        border: 1px solid var(--sds-border-strong);
        border-radius: 6px;
        color: var(--sds-text);
        background: #111111;
      }
      .grid-preview-frame {
        position: relative;
        width: 100%;
        min-height: 118px;
        overflow: hidden;
        border: 1px solid var(--sds-border);
        border-radius: 6px;
        background: #111111;
      }
      .grid-preview-frame::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.72;
        background: var(--grid-preview);
      }
      .grid-metrics {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }
      .grid-metric {
        min-width: 0;
        padding: 8px;
        border: 1px solid var(--sds-border);
        border-radius: 6px;
        background: #171717;
      }
      .grid-metric strong,
      .grid-metric span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .navigation-profile-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 10px;
        margin-top: 12px;
      }
      .navigation-profile-card {
        display: grid;
        gap: 8px;
        padding: 10px;
        border: 1px solid var(--sds-border);
        border-radius: 6px;
        background: var(--sds-panel-2);
      }
      .navigation-profile-card header { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
      .navigation-profile-card header span,
      .navigation-profile-card p { color:var(--sds-muted); font-size:11px; }
      .navigation-profile-card p { margin:0; line-height:1.4; }
      .grid-layout-select { grid-column:span 3; display:grid; grid-template-columns:minmax(0, 1fr) 120px; gap:8px; align-items:end; }
      .grid-layout-select label { display:grid; gap:5px; color:var(--sds-muted); }
      .type-family-card {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 18px;
        align-items: stretch;
      }
      .type-field-grid {

      function renderHeader() {
        return `<header class="topbar">
          <div class="title"><h1>${text("CRRC Sifang PHM 3.0 Design System Manager", "CRRC Sifang PHM 3.0 Design System Manager")}</h1><p>${text("基础系统管理：颜色系统在右侧完整展开，其他基础系统从左侧菜单进入。", "Foundation system management: the full color workflow lives on the right, while other foundations are accessed from the left menu.")}</p></div>
          <div class="toolbar">
            <button class="button" data-lang type="button">${state.lang === "zh" ? "EN" : "中文"}</button>
            <button class="button" data-close type="button">${text("关闭", "Close")}</button>
          </div>
        </header>`;
      }
      function renderNotice() {
        if (!state.notice) return "";
        return `<section class="panel"><div class="notice ${state.notice.kind || ""}">${state.notice.text}</div></section>`;
      }
      function renderDashboard(system) {
        const variablePayload = activeColorPayload(system);
        return `<div class="grid">
          ${renderNotice()}
          <section class="panel">
            <div class="stats">
              <div class="stat"><strong>9</strong><span>${text("主题与反馈色盘", "Theme and feedback palettes")}</span></div>
              <div class="stat"><strong>2</strong><span>${text("明暗主题模式", "Theme modes")}</span></div>
              <div class="stat"><strong>${variablePayload.variables.length}</strong><span>${text("可写入颜色变量", "Writable variables")}</span></div>
              <div class="stat"><strong>${contrastSchemes.standard.min}:1</strong><span>${text("最低文本对比度", "Minimum text contrast")}</span></div>
            </div>
          </section>
          <section class="panel">${renderComponentPreview(system)}</section>
        </div>`;
      }
      function seedCard(role, zh, en) {
        const hex = normalizeHex(state.seeds[role]);
        return `<div class="seed-card">
          <label>${text(zh, en)}</label>
          <div class="seed-preview" style="background:${hex}"></div>
          <div class="input-row">
            <input class="text-input" data-seed-hex="${role}" value="${hex}" aria-label="${role} hex">
            <input class="text-input" data-seed-hsb="${role}" value="${formatHsb(hex)}" aria-label="${role} hsb">
          </div>
        </div>`;
      }
      function renderImageSwatches() {
        if (!state.extractedColors.length) {
          return `<div class="notice">${text("上传图片或从剪切板读取图片后，这里会显示候选主题色。", "Upload an image or read an image from clipboard to show candidate theme colors here.")}</div>`;
        }
        return `<div class="swatch-actions">
          ${state.extractedColors.map((item, index) => `<div class="image-swatch">
            <span class="image-swatch-color" style="background:${item.hex}"></span>
            <span class="image-swatch-meta">
              <strong>${item.hex}</strong>
              <span>${formatHsb(item.hex)}</span>
              <span>${text("样本", "Samples")} ${item.count}</span>
              <span class="role-buttons">
                <button class="role-button" data-image-role="primary" data-image-index="${index}" type="button">${text("主", "P")}</button>
                <button class="role-button" data-image-role="secondary" data-image-index="${index}" type="button">${text("辅", "S")}</button>
                <button class="role-button" data-image-role="tertiary" data-image-index="${index}" type="button">${text("扩", "E")}</button>
              </span>
            </span>
          </div>`).join("")}
        </div>`;
      }
      function renderSeeds() {
        return `<div class="grid">
          ${renderNotice()}
          <section class="panel">

            <p>${text("支持 Hex / HSB 手动输入，也可以上传图片或读取剪切板图片，从图片中提取候选主题色。", "Supports manual Hex / HSB input, image upload, and clipboard image reading to extract candidate theme colors.")}</p>

          <section class="panel">

        const pendingReviews = scan.items.filter((item) => item.needsReview && !item.isReviewed).length;

      function setSeed(role, hex) {

        const colorStep = event.target.closest("[data-color-step]");

        if (event.target.closest("[data-generate]")) {

          state.appearanceManagement = { scan: null, modeName: "Light", selections: {} };

          state.writeSelection = Object.fromEntries(Object.keys(state.writeConfirm).map((key) => [key, true]));

        const appearanceMode = event.target.closest("[data-appearance-mode]");
        if (appearanceMode) { state.appearanceManagement.modeName = appearanceMode.dataset.appearanceMode; state.appearanceManagement.scan = null; state.appearanceManagement.selections = {}; render(); return; }
        if (event.target.closest("[data-read-appearance]")) {

        if (message.type === "design-system/write-error") {

        if (message.type === "component-system/prepare-page-result") {

          state.active = "components";
          render();
        }
        if (message.type === "component-system/prepare-page-error") {

        if (message.type === "component-system/collect-masters-result") {

          state.active = "components";

        if (message.type === "component-system/collect-masters-error") {

          state.active = "components";
          render();
        }
        if (message.type === "typography/font-list-result") {
          state.availableFonts = message.families || [];
          if (state.active === "typography") render();
        }
        if (message.type === "typography/font-list-error") {
          state.notice = { kind: "error", text: `${text("读取本地字体失败", "Failed to read local fonts")}: ${message.reason}` };
          if (state.active === "typography") render();

      };
      parent.postMessage({ pluginMessage: { type: "typography/list-fonts" } }, "*");
      function hueDistance(a, b) {
        const delta = Math.abs(a - b) % 360;
        return Math.min(delta, 360 - delta);
      }
      function chooseSeedCandidates(colors) {
        if (!colors.length) return [];
        const sorted = [...colors].sort((a, b) => b.score - a.score);
        const selected = [sorted[0]];
        while (selected.length < 3 && sorted.length > selected.length) {
          const next = sorted
            .filter((item) => !selected.includes(item))
            .sort((a, b) => {
              const aDistance = Math.min(...selected.map((item) => hueDistance(item.hsb.h, a.hsb.h)));
              const bDistance = Math.min(...selected.map((item) => hueDistance(item.hsb.h, b.hsb.h)));
              return bDistance - aDistance || b.score - a.score;
            })[0];
          if (!next) break;
          selected.push(next);
        }
        return selected;
      }
      function autoAssignImageColors() {
        const selected = chooseSeedCandidates(state.extractedColors);
        ["primary", "secondary", "tertiary"].forEach((role, index) => {
          if (selected[index]) state.seeds[role] = selected[index].hex;
        });
        state.generated = null;
        state.notice = selected.length
          ? { kind: "success", text: text("已智能分配候选主题色。", "Candidate theme colors assigned.") }
          : { kind: "error", text: text("暂无可分配的候选色。", "No candidate colors to assign.") };
        render();
      }
      function extractImageColors(file, label) {
        const reader = new FileReader();
        reader.onload = () => {
          const image = new Image();
          image.onload = () => {
            const canvas = document.createElement("canvas");
            const maxSize = 180;
            const scale = Math.min(1, maxSize / Math.max(image.width, image.height));
            canvas.width = Math.max(1, Math.round(image.width * scale));
            canvas.height = Math.max(1, Math.round(image.height * scale));
            const ctx = canvas.getContext("2d", { willReadFrequently: true });
            ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
            const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            const buckets = new Map();
            for (let index = 0; index < data.length; index += 16) {
              const alpha = data[index + 3];
              if (alpha < 180) continue;
              const rgb = { r: data[index], g: data[index + 1], b: data[index + 2] };
              const hsb = rgbToHsb(rgb);
              if (hsb.b < 14 || hsb.b > 97 || hsb.s < 12) continue;
              const key = `${Math.round(hsb.h / 12) * 12}-${Math.round(hsb.s / 10) * 10}-${Math.round(hsb.b / 10) * 10}`;
              if (!buckets.has(key)) buckets.set(key, { r: 0, g: 0, b: 0, count: 0, score: 0 });
              const bucket = buckets.get(key);
              bucket.r += rgb.r;
              bucket.g += rgb.g;
              bucket.b += rgb.b;
              bucket.count += 1;
              bucket.score += hsb.s * 0.55 + (100 - Math.abs(hsb.b - 62)) * 0.32 + Math.min(bucket.count, 28) * 0.13;
            }
            const rawColors = Array.from(buckets.values())
              .filter((bucket) => bucket.count > 2)
              .map((bucket) => {
                const hex = rgbToHex({ r: bucket.r / bucket.count, g: bucket.g / bucket.count, b: bucket.b / bucket.count });
                const hsb = hexToHsb(hex);
                return { hex, hsb, score: bucket.score * Math.sqrt(bucket.count), count: bucket.count };
              })
              .sort((a, b) => b.score - a.score);
            const filtered = [];
            rawColors.forEach((item) => {
              if (filtered.some((current) => hueDistance(current.hsb.h, item.hsb.h) < 10 && Math.abs(current.hsb.s - item.hsb.s) < 12 && Math.abs(current.hsb.b - item.hsb.b) < 12)) return;
              filtered.push(item);
            });
            state.imagePreview = reader.result;
            state.extractedColors = filtered.slice(0, 10);
            state.notice = {
              kind: state.extractedColors.length ? "success" : "error",
              text: state.extractedColors.length
                ? text(`已从 ${label} 提取 ${state.extractedColors.length} 个候选色。`, `Extracted ${state.extractedColors.length} candidate colors from ${label}.`)
                : text("没有提取到足够清晰的候选色。", "No clear candidate colors were extracted.")
            };
            state.active = "seeds";
            render();
          };
          image.src = reader.result;
        };
        reader.readAsDataURL(file);
      }
      async function readClipboardImage() {
        try {
          const items = await navigator.clipboard.read();
          for (const item of items) {
            const imageType = item.types.find((type) => type.startsWith("image/"));
            if (imageType) {
              const blob = await item.getType(imageType);
              extractImageColors(blob, text("剪切板图片", "Clipboard image"));
              return;
            }
          }
          state.notice = { kind: "error", text: text("剪切板中没有图片。也可以直接 Ctrl+V 粘贴。", "No image found in clipboard. You can also paste with Ctrl+V.") };
        } catch (error) {
          state.notice = { kind: "error", text: text("当前环境无法直接读取剪切板，请点击插件窗口后使用 Ctrl+V 粘贴图片。", "Clipboard reading is unavailable here. Click the plugin window and paste with Ctrl+V instead.") };
        }
        render();
      }
      function importColorSystem(file) {
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(String(reader.result || ""));
            const payload = parsed.colorSystem || parsed.color || parsed;
            if (!payload || !Array.isArray(payload.modes) || !Array.isArray(payload.variables)) {
              throw new Error(text("JSON 中没有有效的 colorSystem。", "No valid colorSystem was found in the JSON."));
            }
            const seedMap = parsed.seeds || {};
            payload.variables.forEach((variable) => {
              const firstValue = variable.defaultHex || variable.valuesByMode?.[payload.modes[0]];
              if (variable.name === "color/seed/primaryBrandSeed") seedMap.primary = firstValue;
              if (variable.name === "color/seed/secondaryBrandSeed") seedMap.secondary = firstValue;
              if (variable.name === "color/seed/tertiaryBrandSeed") seedMap.tertiary = firstValue;
            });
            ["primary", "secondary", "tertiary"].forEach((role) => {
              if (seedMap[role]) state.seeds[role] = normalizeHex(seedMap[role], state.seeds[role]);
            });
            state.generated = null;
            state.colorPayloadOverride = payload;
            state.colorSourceKind = "import";
            state.colorSource = { labelZh: `导入文件 ${file.name}`, labelEn: `Imported file ${file.name}` };
            state.notice = {
              kind: "success",
              text: text(`已独立导入 ${payload.variables.length} 个颜色变量。`, `Imported ${payload.variables.length} color variables independently.`)
            };
          } catch (error) {
            state.notice = { kind: "error", text: `${text("颜色系统导入失败", "Color system import failed")}: ${error.message || error}` };
          }
          state.active = "color";
          render();
        };
        reader.readAsText(file);
      }
      function importDesignDoc(file) {
        const reader = new FileReader();
        reader.onload = () => {
          const textValue = String(reader.result || "");
          let parsed = null;
          try {
            parsed = JSON.parse(textValue);
          } catch (error) {
            parsed = null;
          }
          state.importedDesignDoc = {
            name: file.name,
            size: file.size,
            type: file.type || "unknown",
            importedAt: new Date().toISOString(),
            parseStatus: parsed ? "jsonParsed" : "metadataOnly",
            topLevelKeys: parsed && typeof parsed === "object" ? Object.keys(parsed).slice(0, 24) : []
          };
          state.notice = {
            kind: parsed ? "success" : "error",
            text: parsed
              ? text("已导入 Figma design JSON 快照。", "Figma design JSON snapshot imported.")
              : text("已读取文件元数据，但当前版本暂不解析 .fig 二进制文件。", "File metadata read. This version does not parse .fig binary files yet.")
          };
          state.active = "variables";
          render();
        };
        reader.readAsText(file);
      }
      async function exportCurrentJson() {
        const payload = buildExportPayload(ensureGenerated());
        const json = JSON.stringify(payload, null, 2);
        const fileName = `CRRC_Sifang_PHM_3_Design_System_Manager_v0.7.5_${new Date().toISOString().slice(0, 10)}.json`;
        if (typeof window.showSaveFilePicker === "function") {
          try {
            const handle = await window.showSaveFilePicker({
              suggestedName: fileName,
              types: [{ description: "JSON", accept: { "application/json": [".json"] } }]
            });
            const writable = await handle.createWritable();
            await writable.write(json);
            await writable.close();
            state.notice = { kind: "success", text: text("JSON 文件已保存。", "JSON file saved.") };
            render();
            return;
          } catch (error) {
            if (error?.name === "AbortError") return;
          }
        }
        const blob = new Blob([json], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        state.notice = { kind: "success", text: text("JSON 文件已导出。", "JSON file exported.") };
        render();
      }
      async function openDemoFilePicker(label) {
        const input = label.querySelector('input[type="file"]');
        if (!input) return;
        if (typeof window.showOpenFilePicker !== "function") {
          input.click();
          return;
        }
        const isImage = input.matches("[data-image-upload]");
        const isColorJson = input.matches("[data-color-system-import]");
        const pickerOptions = isImage
          ? { multiple: false, types: [{ description: "Images", accept: { "image/*": [".png", ".jpg", ".jpeg", ".webp", ".gif", ".bmp"] } }] }
          : { multiple: false, types: [{ description: isColorJson ? "Color system JSON" : "Figma design or JSON", accept: { "application/json": [".json"], "application/octet-stream": [".fig"] } }] };
        try {
          const [handle] = await window.showOpenFilePicker(pickerOptions);
          if (!handle) return;
          const file = await handle.getFile();
          if (isImage) extractImageColors(file, file.name);
          else if (isColorJson) importColorSystem(file);
          else importDesignDoc(file);
        } catch (error) {
          if (error?.name !== "AbortError") input.click();
        }
      }
      document.addEventListener("click", (event) => {
        const label = event.target.closest("label.file-button");
        if (!label) return;
        event.preventDefault();
        openDemoFilePicker(label);
      });
      render();
    </script>
